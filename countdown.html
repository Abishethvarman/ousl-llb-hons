
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLB CAT 1 Countdown</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: #020617;
  color: #e5e7eb;
  margin: 0;
}

header {
  text-align: center;
  padding: 35px 15px;
  background: radial-gradient(circle, #064e3b, #020617);
}

h1 {
  margin: 0;
  font-size: 2.5rem;
  color: #10b981;
}

header p {
  color: #9ca3af;
  margin-bottom: 0;
}

.container {
  max-width: 1150px;
  margin: 25px auto;
  padding: 20px;
}

.quote {
  background: #0f172a;
  padding: 20px;
  border-left: 5px solid #34d399;
  margin-bottom: 30px;
  font-size: 1.05rem;
  font-style: italic;
  border-radius: 10px;
}

.main-timer {
  background: #0f172a;
  padding: 35px 20px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 35px;
  box-shadow: 0 0 25px rgba(16,185,129,0.2);
}

.main-timer h2 {
  color: #fbbf24;
}

.main-date {
  color: #60a5fa;
  font-weight: bold;
  margin: 15px;
}

.digital-big {
  font-family: 'Courier New', monospace;
  font-size: clamp(1.7rem, 5vw, 3.5rem);
  color: #10b981;
  font-weight: bold;
}

.section-title {
  color: #34d399;
  margin: 35px 0 18px;
  padding-bottom: 10px;
  border-bottom: 1px solid #1e293b;
}

.subjects {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
  gap: 20px;
}

.subject {
  background: #0f172a;
  padding: 22px;
  border-radius: 12px;
  border: 1px solid #1e293b;
  transition: 0.3s;
}

.subject:hover {
  transform: translateY(-4px);
  border-color: #10b981;
  box-shadow: 0 0 18px rgba(16,185,129,0.15);
}

.level {
  color: #34d399;
  font-size: 0.8rem;
  font-weight: bold;
  letter-spacing: 1px;
}

.subject h3 {
  font-size: 1.05rem;
  line-height: 1.5;
  min-height: 55px;
  color: #f3f4f6;
}

.code {
  color: #94a3b8;
  font-size: 0.9rem;
}

.exam-date {
  color: #fbbf24;
  font-weight: 600;
  margin-top: 15px;
}

.exam-time {
  color: #60a5fa;
  font-size: 0.9rem;
  margin-top: 7px;
}

.sessions {
  margin-top: 15px;
  padding: 10px;
  background: #020617;
  border-radius: 7px;
  color: #a7f3d0;
  font-size: 0.9rem;
}

.digital {
  font-family: 'Courier New', monospace;
  font-size: 1.25rem;
  color: #6ee7b7;
  margin-top: 20px;
  font-weight: bold;
  overflow-wrap: anywhere;
}

.finished {
  color: #ef4444 !important;
}

footer {
  text-align: center;
  padding: 25px;
  color: #9ca3af;
  font-size: 0.9rem;
}

@media(max-width:600px) {
  h1 {
    font-size: 1.8rem;
  }

  .container {
    padding: 12px;
  }

  .main-timer {
    padding: 25px 12px;
  }
}
</style>
</head>

<body>

  <h2 class="section-title">LEVEL 3 – CAT 1</h2>

  <h2 class="section-title">LEVEL 4 – CAT 1</h2>

</div>

<footer>
  Study with discipline. Practice with integrity.
  Enter every assessment with confidence.
  <br><br>
  LLB | Level 3 & Level 4 | CAT 1 – 2026
</footer>

<script>

  },
  {

    code: "LLU3602",

  },
  {

    end: "10:30 PM",
    sessions: "Sessions 1–3"
  },
  {
    level: "LEVEL 3",
    code: "LLU3604",
    name: "Constitutional Law I",
    date: "2026-12-16",
    time: "11:30 PM",
    end: "12:30 PM",
    sessions: "Sessions 1–5"
  },
  {
    level: "LEVEL 3",
    code: "LLU3505",
    name: "Equity and Trusts Law",
    date: "2026-12-19",
    time: "09:30 AM",
    end: "10:30 AM",
    sessions: "Sessions 1–4"
  },
  {
    level: "LEVEL 3",

  // LEVEL 4

  {

  },
  {

  },
  {

  },
  {

  }

// Convert local date and time into a Date object.
// Supports times such as 09:30 PM.

function makeDate(date, time) {
  const [year, month, day] = date.split("-").map(Number);
  const match = time.match(/(\d+):(\d+)\s*(AM|PM)/i);

  let hour = Number(match[1]);
  const minute = Number(match[2]);
  const period = match[3].toUpperCase();

  if (period === "PM" && hour !== 12) hour += 12;
  if (period === "AM" && hour === 12) hour = 0;

  return new Date(year, month - 1, day, hour, minute);
}

function formatDate(date) {
  return date.toLocaleDateString("en-US", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });
}

function formatDigital(ms) {
  const days = Math.floor(ms / 86400000);
  const hours = Math.floor((ms / 3600000) % 24);
  const minutes = Math.floor((ms / 60000) % 60);
  const seconds = Math.floor((ms / 1000) % 60);

  return `${String(days).padStart(2,"0")}d :
          ${String(hours).padStart(2,"0")}h :
          ${String(minutes).padStart(2,"0")}m :
          ${String(seconds).padStart(2,"0")}s`;
}

function renderSubjects() {

  ["LEVEL 3", "LEVEL 4"].forEach(level => {

    const container = document.getElementById(
      level === "LEVEL 3" ? "level3" : "level4"
    );

    const filtered = subjects.filter(s => s.level === level);

    container.innerHTML = filtered.map((s, index) => `
      <div class="subject">
        <div class="level">${s.level}</div>
        <h3>${s.name}</h3>
        <div class="code">${s.code}</div>
        <div class="exam-date">${formatDate(makeDate(s.date, s.time))}</div>
        <div class="exam-time">
          Time: ${s.time} – ${s.end}
        </div>
        <div class="sessions">
          <strong>Sessions to be studied:</strong><br>
          ${s.sessions}
        </div>
        <div class="digital" id="timer-${s.code}">
          Loading...
        </div>
      </div>
    `).join("");

  });
}

function updateTimers() {

  const now = new Date();

  const upcoming = subjects
    .map(s => ({
      subject: s,
      date: makeDate(s.date, s.time)
    }))
    .filter(s => s.date > now)
    .sort((a, b) => a.date - b.date);

  const main = document.getElementById("mainExam");

  if (upcoming.length > 0) {

    const next = upcoming[0];

    main.textContent = formatDigital(next.date - now);
    document.getElementById("mainDate").textContent =
      next.subject.level + " | " +
      next.subject.code + " | " +
      formatDate(next.date);

  } else {

    main.textContent = "ALL ASSESSMENTS COMPLETED";
    main.classList.add("finished");
    document.getElementById("mainDate").textContent =
      "CAT 1 – December 2026";

  }

  subjects.forEach(s => {

    const exam = makeDate(s.date, s.time);
    const element = document.getElementById("timer-" + s.code);

    if (now >= exam) {
      element.textContent = "ASSESSMENT STARTED / COMPLETED";
      element.classList.add("finished");
    } else {
      element.textContent = formatDigital(exam - now);
    }

  });
}

const quotes = [

  "Consistency beats last-minute panic.",
  "The law rewards patience, logic, and persistence.",

  "Master the basics and the marks will follow.",
  "Stay focused. Your goals deserve your full effort.",
  "Pressure is temporary. Achievement lasts.",
  "Success is built quietly through daily consistency.",
  "Keep studying. Future victories are being prepared today."
];

function newQuote() {
  document.getElementById("quoteBox").textContent =
    quotes[Math.floor(Math.random() * quotes.length)];
}

renderSubjects();
newQuote();
updateTimers();

setInterval(updateTimers, 1000);
setInterval(newQuote, 30000);

</script>

</body>
</html>
